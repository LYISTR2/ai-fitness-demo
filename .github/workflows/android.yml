name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'css/**', 'js/**', 'index.html', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: node scripts/smoke-test.js && node scripts/metrics-test.js && node scripts/plan-v2-test.js
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lianlian-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
